# Render Blueprint.
#
# Render reads this file when you connect the repo and provisions BOTH services
# with the correct build and start commands already filled in — no manual
# configuration in the dashboard.
#
#   render.com → New → Blueprint → connect KUSH-Q-37/pricetrail
#
# Values marked `sync: false` are secrets: Render prompts for them once during
# setup and never stores them in this file. That is why none of your connection
# strings appear here.
#
# Free-tier caveat: Render spins web services down after 15 minutes idle, so the
# first request after a quiet period takes ~30s. The WORKER must be a paid
# background service — a free instance is suspended and the daily sweep would
# never run.

services:
  # ---------------------------------------------------------------------------
  - type: web
    name: pricetrail-api
    runtime: node
    region: singapore # closest Render region to India
    plan: free
    branch: main

    # `pnpm build` builds every workspace package AND both apps. `prisma
    # generate` must run before it — the generated client does not exist in the
    # repo (it is gitignored) and nothing compiles without it.
    # `npm i -g pnpm`, NOT `corepack enable`.
    #
    # corepack installs its shim by symlinking into /usr/bin, which is
    # read-only on Render's builders — the build dies with
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'".
    # A global npm install writes to a path the build user owns.
    buildCommand: npm i -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm --filter @pricetrail/database generate && pnpm build
    startCommand: node apps/api/dist/main.js

    healthCheckPath: /health/live

    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info
      # The OpenAPI document is a complete map of the attack surface.
      - key: SWAGGER_ENABLED
        value: "false"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"

      # Host the queue consumers inside this process.
      #
      # "true" is correct when the paid worker service below is NOT deployed.
      # Without it the API enqueues scrape jobs that nothing consumes, and
      # every product sits at "Fetching details" forever.
      #
      # Flip to "false" once pricetrail-worker is running, so scraping stops
      # competing with request handling for this instance's event loop.
      - key: RUN_WORKERS_IN_API
        value: "true"
      # Never above 1 here. A Playwright fallback context costs 300-500 MB and
      # would evict the API from a free instance's 512 MB.
      - key: API_SCRAPE_CONCURRENCY
        value: "1"

      # Minutes over which the daily sweep spreads its fetches.
      #
      # The worker service below uses 360, which is right for an always-on
      # process: enqueueing every product at once is indistinguishable from an
      # attack and gets the IP range blocked.
      #
      # It is wrong when the workers are co-hosted on a free instance. Render
      # sleeps a web service after ~15 minutes idle, and a BullMQ delayed job
      # is only promoted while a worker is actually running — so jobs scheduled
      # hours after the sweep are never picked up, and the product records one
      # observation on the day it was added and nothing afterwards.
      #
      # 8 minutes keeps the whole sweep inside a single wake window while still
      # spacing the requests. Raise it only when a dedicated worker is running.
      - key: SWEEP_WINDOW_MINUTES
        value: "8"

      # Rolling price-history window. The daily retention job drops
      # price_points partitions older than this. Must match the longest chart
      # range the UI offers (15M) — see price.schemas.ts.
      - key: PRICE_HISTORY_RETENTION_MONTHS
        value: "15"

      # --- prompted at deploy time -------------------------------------------
      - key: DATABASE_URL # Supabase POOLER, port 6543, ?pgbouncer=true&connection_limit=1
        sync: false
      - key: DIRECT_URL # Supabase DIRECT, port 5432 — migrations only
        sync: false
      - key: REDIS_URL # Upstash rediss:// (TLS)
        sync: false
      - key: CORS_ORIGINS # your Vercel URL, exactly, no trailing slash
        sync: false

      # --- add once Amazon Associates issues Creators API credentials --------
      # PA-API was retired on 15 May 2026; these replace it. Credentials
      # require an approved Associates account with qualifying sales.
      # AMAZON_CREATORS_VERSION is stamped on the credential by Amazon and
      # selects the OAuth token host — amazon.in is v3.2 (EU), which is also
      # the default if unset.
      - key: AMAZON_CREATORS_CLIENT_ID
        sync: false
      - key: AMAZON_CREATORS_CLIENT_SECRET
        sync: false
      - key: AMAZON_CREATORS_PARTNER_TAG
        sync: false
      - key: AMAZON_CREATORS_VERSION
        sync: false

  # ---------------------------------------------------------------------------
  - type: worker
    name: pricetrail-worker
    runtime: node
    region: singapore
    # NOT free: Render suspends free instances, and a suspended worker means the
    # 02:00 sweep silently never runs and no prices are ever recorded.
    plan: starter
    branch: main

    # `npm i -g pnpm`, NOT `corepack enable`.
    #
    # corepack installs its shim by symlinking into /usr/bin, which is
    # read-only on Render's builders — the build dies with
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'".
    # A global npm install writes to a path the build user owns.
    buildCommand: npm i -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm --filter @pricetrail/database generate && pnpm build
    startCommand: node apps/worker/dist/main.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: UTC
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info
      # Each Playwright context costs 300-500 MB. This number times the browser
      # fallback rate is the real memory ceiling — raise it only after watching
      # actual usage.
      - key: SCRAPE_CONCURRENCY
        value: "2"
      # Spread the daily fetches over 6 hours. Enqueueing everything at once is
      # indistinguishable from an attack and gets the IP range blocked.
      - key: SWEEP_WINDOW_MINUTES
        value: "360"

      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AMAZON_CREATORS_CLIENT_ID
        sync: false
      - key: AMAZON_CREATORS_CLIENT_SECRET
        sync: false
      - key: AMAZON_CREATORS_PARTNER_TAG
        sync: false
      - key: AMAZON_CREATORS_VERSION
        sync: false
