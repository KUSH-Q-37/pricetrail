packages:
  - "apps/*"
  - "packages/*"

# NOTE: `injectWorkspacePackages: true` was tried here to make `pnpm deploy`
# emit a self-contained tree for the Dockerfiles. It BREAKS local development —
# injected packages are copied at install time rather than symlinked, so edits
# to packages/* stop propagating and apps/worker fails to resolve
# @pricetrail/queue until a full reinstall. Do not re-add it without solving
# that; see docs for the Docker packaging status.

# pnpm blocks dependency postinstall scripts by default (supply-chain
# hardening). Each entry below is an explicit trust decision.
allowBuilds:
  # Download query engines and generate the typed client. Prisma is unusable
  # without these.
  "@prisma/client": true
  "@prisma/engines": true
  "prisma": true
  # Pulled in by tsx; needs its platform-specific binary.
  "esbuild": true
  # Anonymous usage telemetry, pulled in transitively by @nestjs/core.
  # Denied: it phones home on install and nothing depends on it running.
  "@scarf/scarf": false
  # ONNX inference runtime — downloads the native binary that actually runs
  # the embedding model. Without it, @huggingface/transformers cannot infer.
  "onnxruntime-node": true
  # Parses the model's protobuf graph.
  "protobufjs": true
  # Image preprocessing. Not needed for text embeddings, but
  # @huggingface/transformers imports it from its top-level entry point, so a
  # missing native binary breaks module load rather than just image pipelines.
  "sharp": true
  # Optional native accelerator for msgpackr (BullMQ's job serializer).
  # Denied: msgpackr falls back to a pure-JS encoder with no behavioural
  # difference, and job payloads here are small enough that the speedup is
  # irrelevant. Not worth a native build step in every CI image.
  "msgpackr-extract": false
