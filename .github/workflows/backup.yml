# Weekly database backup.
#
# The free Supabase tier has no point-in-time recovery. A bad migration, a
# mistaken delete, or a paused-then-reaped project takes the price history with
# it — and that history is the one thing in this system that cannot be rebuilt.
# Code can be rewritten in a day; an observation from three months ago is gone
# for good, because neither marketplace publishes past prices.
#
# So this runs on the cheapest thing available: a scheduled Action, dumping to
# an artifact. Not as good as managed PITR. Enormously better than nothing.
#
# SETUP (once):
#   GitHub → repo → Settings → Secrets and variables → Actions → New secret
#   Three secrets, each a plain value — do NOT percent-encode anything:
#     PGHOST      aws-0-ap-south-1.pooler.supabase.com
#     PGUSER      postgres.<your-project-ref>
#     PGPASSWORD  your database password, exactly as Supabase shows it
#
#   Port 5432 is fixed in the job, not a secret. 6543 is the transaction pooler
#   and pg_dump cannot use it: a dump holds a repeatable-read snapshot and
#   issues SET and COPY across statements, while PgBouncer in transaction mode
#   hands each statement to a different backend. Same reason DIRECT_URL exists
#   separately from DATABASE_URL.
#
# RESTORE:
#   Download the artifact, unzip, then:
#     psql "$DATABASE_URL" < pricetrail-backup.sql

name: backup

on:
  schedule:
    - cron: '30 20 * * 0' # Sundays 20:30 UTC = 02:00 IST Monday
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump to artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dump database
        env:
          # Discrete values, not a URL. A Supabase password routinely contains
          # @ # $ &, and in a URL those must be percent-encoded — an unencoded
          # @ makes the parser split there and read the rest of the password as
          # the hostname ("could not translate host name 721755@aws-0-..."),
          # which names everything except the actual cause.
          #
          # pg_dump reads PG* natively, so PGPASSWORD is taken literally and no
          # encoding rule exists to get wrong.
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: '5432'
          PGDATABASE: postgres
        run: |
          if [ -z "$PGHOST" ] || [ -z "$PGUSER" ] || [ -z "$PGPASSWORD" ]; then
            echo "::error::Set PGHOST, PGUSER and PGPASSWORD secrets — see the setup note in this file."
            exit 1
          fi

          # Port 5432 is hardcoded above rather than taken from a secret: 6543
          # is the transaction pooler, and pg_dump cannot run through it at all.
          # Making it un-settable removes the only wrong answer.
          #
          # pg_dump runs in a container rather than from apt, so the client
          # version is pinned and cannot drift behind the server. pg_dump
          # refuses to dump a server newer than itself, and a backup job that
          # only fails after an upstream upgrade is worse than no job at all.
          docker run --rm \
            -e PGHOST -e PGUSER -e PGPASSWORD -e PGPORT -e PGDATABASE \
            postgres:17-alpine \
            pg_dump --no-owner --no-privileges > pricetrail-backup.sql

          # A dump that "succeeded" but is empty is the classic silent backup
          # failure. Fail loudly instead.
          BYTES=$(wc -c < pricetrail-backup.sql)
          echo "dump size: $BYTES bytes"
          if [ "$BYTES" -lt 10000 ]; then
            echo "::error::Dump is implausibly small ($BYTES bytes) — treating as failed."
            exit 1
          fi

          # Prove the data is actually in there, not just the schema.
          grep -q "COPY public.price_points" pricetrail-backup.sql \
            || echo "::warning::No price_points COPY block found. Fine if you have no history yet."

          gzip pricetrail-backup.sql

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pricetrail-backup-${{ github.run_number }}
          path: pricetrail-backup.sql.gz
          retention-days: 90
          if-no-files-found: error
