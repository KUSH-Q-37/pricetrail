# Keeps the free tiers alive, and raises the alarm when they are not.
#
# Three free-tier behaviours quietly break this product:
#
#   - Render sleeps a free web service after ~15 minutes idle, and a sleeping
#     process runs no cron. The 02:00 sweep simply never fires.
#   - Supabase pauses a free project after 7 days with no activity. A paused
#     database does not error loudly; writes just stop.
#   - The co-hosted queue consumers can die while the API keeps serving HTTP,
#     which is exactly what happened on 15 Aug 2026 — three days with no price
#     recorded, every dashboard green, nothing to notice it.
#
# All three fail silently, and the damage is permanent: a day with no
# observation can never be backfilled, because neither marketplace publishes
# past prices.
#
# So this job does two things at once. Hitting /health/ready wakes the API and
# touches Postgres, and because that endpoint now also reports worker state and
# observation freshness, a non-200 here IS the alarm. Failure emails the repo
# owner.
#
# Chosen over an external pinger (cron-job.org and similar) because those bill
# a cold start as a failed check and email about it forever.
#
# Cost: four runs a day, seconds each — far inside the free Actions allowance.

name: keepalive

on:
  schedule:
    # UTC. 01:45 sits just before the 02:00 sweep so the service is already
    # warm when BullMQ fires it; the rest are spread to keep Supabase from
    # counting a quiet day toward its 7-day pause.
    - cron: '45 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: wake API and verify it is actually working
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      API: https://pricetrail-api.onrender.com

    steps:
      - name: Check readiness
        run: |
          # --max-time 90, not the default: a cold Render start takes 30-50s,
          # and timing out early would report a working service as broken.
          for attempt in 1 2 3; do
            echo "--- attempt $attempt ---"

            CODE=$(curl -sS --max-time 90 \
              -o /tmp/ready.json -w '%{http_code}' \
              "$API/health/ready" || echo "000")

            cat /tmp/ready.json 2>/dev/null || true
            echo ""

            if [ "$CODE" = "200" ]; then
              echo "awake and healthy"
              exit 0
            fi

            echo "HTTP $CODE — retrying in 30s"
            sleep 30
          done

          echo "::error::API unhealthy after 3 attempts. The JSON above names the failing check:"
          echo "::error::  workers.state = failed   -> queue consumers are down; redeploy pricetrail-api"
          echo "::error::  observations.stale = true -> no price recorded in 26h; the sweep is not running"
          echo "::error::  dependencies.*.status = down -> Postgres or Redis unreachable"
          exit 1
